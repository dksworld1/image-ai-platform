spring:
  config:
    import: classpath:config/datasource/jdbc-local.yaml
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  migration:
    enabled: true
    app-locations:
      - classpath:db/migration/app
      - classpath:db/seed/app/common
      - classpath:db/seed/app/local
  cors:
    allowed-origin: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
  auth:
    jwt:
      secret: local-only-jwt-signing-key-not-for-production-2026
logging:
  config: classpath:config/logger/logback-local.xml
