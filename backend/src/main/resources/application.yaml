spring:
  application:
    name: image-ai-platform-api
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: ${app.storage.images.max-file-size}
      max-request-size: 11MB

server:
  port: 8080

app:
  storage:
    artifacts:
      # 새 아티팩트 파일을 저장할 때 사용할 roots 항목의 키입니다.
      # 예: default-root를 disk-d로 바꾸려면 roots 아래에 disk-d: D:/artifact-data를 추가합니다.
      # 기존 파일은 DB에 기록된 루트 키로 읽으므로 사용 중인 roots 항목을 유지합니다.
      default-root: local
      roots:
        local: ./data/artifacts
      max-file-size: 10MB
    images:
      directory: ./data/images
      max-file-size: 10MB
      thumbnail-max-edge: 256
    files:
      directory: ./data/files
      max-file-size: 10MB
  migration:
    enabled: false
    app-locations:
      - classpath:db/migration/app
      - classpath:db/seed/app/common
    audit-locations:
      - classpath:db/migration/audit
  cors:
    allowed-origin: http://localhost:5173
  auth:
    jwt:
      secret: ""
      access-token-ttl: PT15M

mybatis:
  config-location: classpath:config/mybatis-config.xml
  mapper-locations: classpath*:mapper/**/*.xml

